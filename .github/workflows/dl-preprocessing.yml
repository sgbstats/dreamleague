name: Refresh DreamLeague data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

concurrency:
  group: dreamleague-preprocessing
  cancel-in-progress: false

jobs:
  preprocess:
    name: Run preprocessing and publish data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      DREAMLEAGUE_SHARED_DRIVE_TARGET: ${{ secrets.DREAMLEAGUE_SHARED_DRIVE_TARGET }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://uapfyikxspmcifgdergl.supabase.co' }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      DREAMLEAGUE_SUPABASE_BUCKET: ${{ vars.DREAMLEAGUE_SUPABASE_BUCKET || 'dreamleague' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::readxl
            any::rvest
            any::RCurl
            any::XML
            any::googlesheets4
            any::googledrive
            any::gargle
            any::fuzzyjoin
            any::crayon
            any::httr
            any::jsonlite
            any::furrr
            any::future
            any::glue
            any::openxlsx
            any::testthat

      - name: Run preprocessing and publish
        shell: Rscript {0}
        run: |
          source("R/dl-preprocessing-run.R")
