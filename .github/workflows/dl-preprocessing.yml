name: Refresh DreamLeague data

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. The paired weekend entries preserve 19:00
    # Europe/London across GMT and British Summer Time.
    - cron: "15 7 * * *"
    - cron: "0 18 * * 6,0"
    - cron: "0 19 * * 6,0"

permissions:
  contents: read

concurrency:
  group: dreamleague-preprocessing
  cancel-in-progress: false

jobs:
  preprocess:
    name: Run preprocessing and publish data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DREAMLEAGUE_GOOGLE_CREDENTIALS_B64: ${{ secrets.DREAMLEAGUE_GOOGLE_CREDENTIALS_B64 }}
      DREAMLEAGUE_SHARED_DRIVE_TARGET: ${{ secrets.DREAMLEAGUE_SHARED_DRIVE_TARGET }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://uapfyikxspmcifgdergl.supabase.co' }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      DREAMLEAGUE_SUPABASE_BUCKET: ${{ vars.DREAMLEAGUE_SUPABASE_BUCKET || 'dreamleague' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Confirm weekend London time
        id: weekend_time
        if: github.event_name == 'schedule'
        run: |
          if [ "${{ github.event.schedule }}" = "0 18 * * 6,0" ] || [ "${{ github.event.schedule }}" = "0 19 * * 6,0" ]; then
            if [ "$(TZ=Europe/London date +%H:%M)" = "19:00" ]; then
              echo "run_preprocessing=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_preprocessing=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run_preprocessing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up R
        if: github.event_name != 'schedule' || steps.weekend_time.outputs.run_preprocessing == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        if: github.event_name != 'schedule' || steps.weekend_time.outputs.run_preprocessing == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::readxl
            any::rvest
            any::RCurl
            any::XML
            any::googlesheets4
            any::googledrive
            any::gargle
            any::fuzzyjoin
            any::crayon
            any::httr
            any::jsonlite
            any::furrr
            any::future
            any::glue
            any::openxlsx
            any::testthat

      - name: Run preprocessing and publish
        if: github.event_name != 'schedule' || steps.weekend_time.outputs.run_preprocessing == 'true'
        shell: Rscript {0}
        run: |
          source("R/dl-preprocessing-run.R")
