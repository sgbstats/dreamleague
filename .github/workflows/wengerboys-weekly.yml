name: Wenger Boys weekly report

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the report without sending the email"
        type: boolean
        default: false
  schedule:
    - cron: "0 1 * * 4"

permissions:
  contents: read

concurrency:
  group: wengerboys-weekly
  cancel-in-progress: false

jobs:
  report:
    name: Build and email the Wenger Boys report
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://uapfyikxspmcifgdergl.supabase.co' }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      DREAMLEAGUE_SUPABASE_BUCKET: ${{ vars.DREAMLEAGUE_SUPABASE_BUCKET || 'dreamleague' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      WENGERBOYS_EMAIL_TO: ${{ secrets.WENGERBOYS_EMAIL_TO }}
      WENGERBOYS_EMAIL_FROM: ${{ vars.WENGERBOYS_EMAIL_FROM || 'Wenger Boys <onboarding@resend.dev>' }}
      WENGERBOYS_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::stringr
            any::rvest
            any::xml2
            any::httr
            any::jsonlite
            any::furrr
            any::future

      - name: Build and send report
        run: Rscript R/wengerboys-weekly.R

      - name: Upload dry-run output
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: wengerboys-report
          path: wengerboys-output/
