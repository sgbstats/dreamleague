name: DreamLeague CI/CD

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run R tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      supabase: ${{ steps.select.outputs.supabase }}
    env:
      WENGERBOYS_SKIP_LIVE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Select test sets from changed files
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed-files.txt"
          base=""
          head="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE"
            # A new branch has no previous commit; compare with the default branch.
            if [[ "$base" =~ ^0+$ ]]; then base="origin/$DEFAULT_BRANCH"; fi
          fi
          # Unknown history or a manual run falls back to every test set.
          if [[ -n "$base" ]] && git diff --name-only "$base...$head" > "$changed" 2>/dev/null; then
            echo "Changed files:"; cat "$changed"
          else
            echo '*' > "$changed"
            echo "Running all test sets."
          fi
          Rscript .github/scripts/select-test-sets.R "$changed"

      - name: Install test dependencies
        if: steps.select.outputs.tests != 'none'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::tidyverse
            any::readxl
            any::rvest
            any::RCurl
            any::XML
            any::googlesheets4
            any::googledrive
            any::gargle
            any::fuzzyjoin
            any::crayon
            any::httr
            any::jsonlite
            any::furrr
            any::future
            any::glue
            any::openxlsx
            any::xml2
            any::rsconnect

      - name: Run selected testthat sets
        if: steps.select.outputs.tests != 'none'
        env:
          DREAMLEAGUE_TEST_SET: ${{ steps.select.outputs.tests }}
        run: Rscript tests/testthat.R

  test-supabase:
    name: Test Supabase round trip
    needs: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.test.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install integration test dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::httr
            any::withr

      - name: Upload, download, compare and clean up synthetic data
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://uapfyikxspmcifgdergl.supabase.co' }}
          DREAMLEAGUE_SUPABASE_BUCKET: ${{ vars.DREAMLEAGUE_SUPABASE_TEST_BUCKET || vars.DREAMLEAGUE_SUPABASE_BUCKET || 'dreamleague' }}
          DREAMLEAGUE_REQUIRE_SUPABASE_TEST: "true"
        run: Rscript -e 'testthat::test_file("tests/testthat/test-shared-supabase-roundtrip.R", stop_on_failure = TRUE)'

  test-github-token:
    name: Test app GitHub PAT permissions
    needs: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'staging' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install token test dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::httr
            any::jsonlite

      - name: Verify the app PAT can read and dispatch data collection
        env:
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}
          DREAMLEAGUE_REQUIRE_GITHUB_TOKEN_TEST: "true"
        run: Rscript -e 'testthat::test_file("tests/testthat/test-shared-github-token.R", stop_on_failure = TRUE)'

  promote-staging:
    name: Promote tested feature to staging
    needs: [test, test-supabase, test-github-token]
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.test-supabase.result) &&
      contains(fromJSON('["success","skipped"]'), needs.test-github-token.result) &&
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dreamleague-staging-promotion
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.STAGING_PROMOTION_TOKEN }}
      GH_REPO: ${{ github.repository }}
      FEATURE_BRANCH: ${{ github.ref_name }}
      TESTED_SHA: ${{ github.sha }}
    steps:
      - name: Open staging PR and enable test-gated auto-merge
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure the STAGING_PROMOTION_TOKEN repository secret."
            exit 1
          fi
          ahead=$(gh api "repos/$GH_REPO/compare/staging...$TESTED_SHA" --jq '.ahead_by')
          if [[ "$ahead" == 0 ]]; then
            echo "The tested commit is already included in staging." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pr=$(gh pr list --base staging --head "$FEATURE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            gh pr create --base staging --head "$FEATURE_BRANCH" \
              --title "Stage $FEATURE_BRANCH" \
              --body "Automatically proposed after feature-branch tests passed. Staging merge checks must also pass. Production promotion remains manual."
            pr=$(gh pr list --base staging --head "$FEATURE_BRANCH" --state open --json number --jq '.[0].number')
          fi
          # Staging requires up-to-date branches, and each promotion adds a merge
          # commit there. Bring the feature branch up to date; that push reruns
          # the tests and the next run promotes the newly tested commit.
          behind=$(gh api "repos/$GH_REPO/compare/staging...$TESTED_SHA" --jq '.behind_by')
          if [[ "$behind" != 0 ]]; then
            gh api -X PUT "repos/$GH_REPO/pulls/$pr/update-branch" -f expected_head_sha="$TESTED_SHA"
            printf 'Feature branch was behind staging; merged staging into it. Promotion continues after the new commit passes tests.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge "$pr" --auto --merge --match-head-commit "$TESTED_SHA"
          url=$(gh pr view "$pr" --json url --jq '.url')
          printf 'Staging promotion: %s\n\nWaiting for protected-branch checks before auto-merge. No production promotion is performed.\n' "$url" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Verify staging Render deployment
    needs: [test, test-supabase, test-github-token]
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.test-supabase.result) &&
      contains(fromJSON('["success","skipped"]'), needs.test-github-token.result) &&
      github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: ${{ vars.RENDER_STAGING_URL }}
    concurrency:
      group: dreamleague-staging-deployment
      cancel-in-progress: false
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_STAGING_SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
      RENDER_STAGING_URL: ${{ vars.RENDER_STAGING_URL }}
    steps:
      - name: Wait for the current commit to deploy on Render
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" || -z "$RENDER_STAGING_SERVICE_ID" ]]; then
            echo "::error::Set RENDER_API_KEY and RENDER_STAGING_SERVICE_ID in the staging GitHub environment."
            exit 1
          fi
          if [[ ! "$RENDER_STAGING_URL" =~ ^https://[A-Za-z0-9.-]+\.onrender\.com/?$ ]]; then
            echo "::error::Set RENDER_STAGING_URL to the staging service's HTTPS onrender.com URL."
            exit 1
          fi
          for attempt in {1..60}; do
            deploys="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 \
              --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_STAGING_SERVICE_ID/deploys?limit=100")"
            deployment="$(jq -cer --arg sha "$GITHUB_SHA" \
              '[.[] | .deploy | select(.commit.id == $sha)] | first // empty' \
              <<< "$deploys" 2>/dev/null || true)"
            if [[ -n "$deployment" ]]; then
              status="$(jq -r '.status' <<< "$deployment")"
              case "$status" in
                live)
                  printf '## Staging ready for review\n\n[Open staging deployment](%s)\n\nCommit: `%s`\n\nThe Render deployment for this commit is live. Review staging before opening and merging a staging-to-main PR.\n' \
                    "$RENDER_STAGING_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                  echo "::error::Render staging deployment for $GITHUB_SHA ended with status $status."
                  exit 1
                  ;;
                created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                  ;;
                *)
                  echo "::error::Unexpected Render staging deployment status: $status."
                  exit 1
                  ;;
              esac
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for the Render staging deployment for $GITHUB_SHA to become live."
          exit 1

  deploy-production:
    name: Deploy production to Render
    needs: [test, test-supabase, test-github-token]
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.test-supabase.result) &&
      contains(fromJSON('["success","skipped"]'), needs.test-github-token.result) &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: Production
      url: https://dreamleague.uk
    concurrency:
      group: dreamleague-production-deployment
      cancel-in-progress: false
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_PRODUCTION_SERVICE_ID: ${{ vars.RENDER_PRODUCTION_SERVICE_ID }}
      RENDER_PRODUCTION_DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
    steps:
      - name: Trigger the approved Render deployment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_PRODUCTION_DEPLOY_HOOK" ]]; then
            echo "::error::Set RENDER_PRODUCTION_DEPLOY_HOOK in the Production GitHub environment."
            exit 1
          fi
          if [[ -z "$RENDER_API_KEY" || -z "$RENDER_PRODUCTION_SERVICE_ID" ]]; then
            echo "::error::Set RENDER_API_KEY and RENDER_PRODUCTION_SERVICE_ID in the Production GitHub environment."
            exit 1
          fi
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --get \
            --data-urlencode "ref=$GITHUB_SHA" \
            --output "$RUNNER_TEMP/render-deploy-hook.json" \
            "$RENDER_PRODUCTION_DEPLOY_HOOK"

      - name: Wait for the production deployment to become live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            deploys="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 \
              --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_PRODUCTION_SERVICE_ID/deploys?limit=100")"
            deployment="$(jq -cer --arg sha "$GITHUB_SHA" \
              '[.[] | .deploy | select(.commit.id == $sha)] | first // empty' \
              <<< "$deploys" 2>/dev/null || true)"
            if [[ -n "$deployment" ]]; then
              status="$(jq -r '.status' <<< "$deployment")"
              case "$status" in
                live)
                  printf '## Production deployment live\n\n[Open dreamleague.uk](https://dreamleague.uk)\n\nCommit: `%s`\n' \
                    "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                  echo "::error::Render production deployment for $GITHUB_SHA ended with status $status."
                  exit 1
                  ;;
                created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                  ;;
                *)
                  echo "::error::Unexpected Render production deployment status: $status."
                  exit 1
                  ;;
              esac
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for the Render production deployment for $GITHUB_SHA to become live."
          exit 1
